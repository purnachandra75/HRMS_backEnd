# Loads application-local.properties if present (git-ignored) so real secrets like SMTP
# credentials can override the defaults below without ever being committed.
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3306/hrms

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
server.port=8080

app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-in-prod-please-change-this-hrms-secret}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:3000}

app.admin.seed-email=${ADMIN_SEED_EMAIL:admin@hrms.local}
app.admin.seed-password=${ADMIN_SEED_PASSWORD:Admin@123}
app.admin.notification-email=${ADMIN_NOTIFICATION_EMAIL:${app.admin.seed-email}}
app.admin.leave-dashboard-path=${ADMIN_LEAVE_DASHBOARD_PATH:/admin/leave-requests}
app.admin.ticket-dashboard-path=${ADMIN_TICKET_DASHBOARD_PATH:/admin/tickets}

# Daily birthday email - midnight by default. Zone blank = server time zone (e.g. set Asia/Kolkata).
app.birthday.cron=${BIRTHDAY_CRON:0 0 0 * * *}
app.birthday.zone=${BIRTHDAY_ZONE:}
# Missed check-out warning: emailed to the employee and their company's admins (HR) when
# someone is still checked in this many hours after check-in. Checked every 15 minutes.
app.attendance.missed-checkout-hours=${MISSED_CHECKOUT_HOURS:14}
app.attendance.missed-checkout-check-ms=${MISSED_CHECKOUT_CHECK_MS:900000}

app.super-admin.seed-email=${SUPER_ADMIN_SEED_EMAIL:superadmin@hrms.local}
app.super-admin.seed-password=${SUPER_ADMIN_SEED_PASSWORD:SuperAdmin@123}
app.default-client.name=${DEFAULT_CLIENT_NAME:Default Company}

# 30 sample employees + 3 projects (DemoDataSeeder). Off by default so production starts
# clean; set DEMO_DATA_ENABLED=true locally to get test data.
app.demo-data.enabled=${DEMO_DATA_ENABLED:false}

app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.password-reset.expiration-minutes=${PASSWORD_RESET_EXPIRATION_MINUTES:30}
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}

spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${SMTP_USERNAME:no-reply@hrms.local}}
